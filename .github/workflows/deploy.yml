name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}
            git pull origin main

            docker stop intrusion-api || true
            docker rm intrusion-api || true

            docker build -t network-intrusion-api .

            docker run -d \
              --restart unless-stopped \
              --name intrusion-api \
              -p 8000:8000 \
              network-intrusion-api